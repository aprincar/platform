name: Format approved UI branch

on:
  push:
    branches:
      - feat/approved-ui-1to1
    paths:
      - .github/workflows/format-approved-ui.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format approved UI files
        run: |
          npx prettier --write             apps/app/src/components/GameCard.tsx             apps/app/src/pages/Discover.tsx             apps/app/src/pages/Progress.tsx             apps/app/src/styles.css
      - name: Commit formatting
        run: |
          git config user.name "aprincar-ui"
          git config user.email "actions@users.noreply.github.com"
          git add apps/app/src/components/GameCard.tsx apps/app/src/pages/Discover.tsx apps/app/src/pages/Progress.tsx apps/app/src/styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(ui): format approved visual refinements"
          git push origin HEAD:feat/approved-ui-1to1
