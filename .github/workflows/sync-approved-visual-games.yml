name: Sync approved visual games preview

on:
  push:
    branches:
      - feat/approved-ui-1to1
    paths:
      - .github/workflows/sync-approved-visual-games.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: aprincar/games-official
          ref: 4740c4a41f4740e3a321d63307ae28e196fa1d89
          path: .visual-games

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build approved visual games
        working-directory: .visual-games
        run: |
          npm ci
          npm run build
          npm run registry

      - name: Update preview pin and snapshots
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'canonical-games.json';
          const pin = JSON.parse(fs.readFileSync(path, 'utf8'));
          pin.commit = '4740c4a41f4740e3a321d63307ae28e196fa1d89';
          fs.writeFileSync(path, JSON.stringify(pin, null, 2) + '\n');
          NODE
          APRINCAR_CANONICAL_GAMES_DIR=.visual-games/dist npm run sync:official
          npm run verify:official

      - name: Commit preview snapshot
        run: |
          git config user.name "aprincar-preview"
          git config user.email "actions@users.noreply.github.com"
          git add canonical-games.json apps/app/public/registry.json apps/app/public/extensions apps/hub/public/registry.json apps/hub/public/extensions
          if git diff --cached --quiet; then
            echo "Preview snapshot already synchronized."
            exit 0
          fi
          git commit -m "build(games): sync approved visual preview"
          git push origin HEAD:feat/approved-ui-1to1
