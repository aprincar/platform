name: Format restored approved stylesheet

on:
  push:
    branches:
      - feat/approved-ui-1to1
    paths:
      - .github/workflows/format-restored-approved-css.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/app/src/styles.css
      - name: Commit formatted stylesheet
        run: |
          git config user.name "aprincar-ui"
          git config user.email "actions@users.noreply.github.com"
          git add apps/app/src/styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(ui): format restored approved stylesheet"
          git push origin HEAD:feat/approved-ui-1to1
