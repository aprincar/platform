name: CodeQL
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: '31 3 * * 2' }]
jobs:
  analyze:
    permissions: { security-events: write, contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
      - name: Print SARIF diagnostics
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sarif = JSON.parse(fs.readFileSync('../results/javascript.sarif', 'utf8'));
          for (const run of sarif.runs ?? []) {
            for (const result of run.results ?? []) {
              const loc = result.locations?.[0]?.physicalLocation;
              const uri = loc?.artifactLocation?.uri ?? 'unknown';
              const line = loc?.region?.startLine ?? 0;
              const level = result.level ?? 'warning';
              const message = result.message?.text ?? '';
              console.log(JSON.stringify({ level, ruleId: result.ruleId, uri, line, message }));
            }
          }
          NODE
      - name: Upload SARIF diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: ../results/*.sarif
          if-no-files-found: error
