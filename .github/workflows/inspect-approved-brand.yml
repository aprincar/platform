name: Inspect approved visual reference assets
on:
  push:
    branches: [feat/approved-ui-1to1]
    paths: [.github/workflows/inspect-approved-brand.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install pillow
      - name: Create small inspection thumbnails
        run: |
          python - <<'PY'
          from PIL import Image
          for label in ('aprincar-brand-board','aprincar-brand-v3-concept'):
              path=f'docs/design/reference/{label}.png'
              img=Image.open(path).convert('RGB')
              print(label,img.size)
              img.thumbnail((700,500))
              img.save(f'docs/design/reference/_inspect-{label}.webp','WEBP',quality=60)
          PY
      - name: Commit visual inspection files
        run: |
          git config user.name "aprincar-visual-inspector"
          git config user.email "actions@users.noreply.github.com"
          git add docs/design/reference/_inspect-*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(brand): inspect reference sources"
          git push origin HEAD:feat/approved-ui-1to1
