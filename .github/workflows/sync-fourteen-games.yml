name: Sync fourteen certified games

on:
  push:
    branches:
      - chore/pin-certified-mobile-games
    paths:
      - .github/workflows/sync-fourteen-games.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout platform branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout canonical games
        uses: actions/checkout@v4
        with:
          repository: aprincar/games-official
          ref: e46e7650f0dd16df143c5a30fbc27356ff4fe736
          path: .canonical-games

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build canonical games and registry
        working-directory: .canonical-games
        run: |
          npm ci
          npm run build
          npm run registry

      - name: Update canonical pin
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const path = 'canonical-games.json';
          const pin = JSON.parse(fs.readFileSync(path, 'utf8'));
          pin.commit = 'e46e7650f0dd16df143c5a30fbc27356ff4fe736';
          fs.writeFileSync(path, JSON.stringify(pin, null, 2) + '\n');
          NODE

      - name: Regenerate App and Hub snapshots
        run: npm run sync:official

      - name: Remove canonical checkout before Platform checks
        run: rm -rf .canonical-games

      - name: Install Platform dependencies
        run: npm ci

      - name: Format touched Platform sources
        run: |
          npx prettier --write \
            apps/app/src/components/GameCard.tsx \
            apps/app/src/game-families.ts \
            apps/app/src/worlds.ts \
            packages/extension-contracts/src/types.ts \
            packages/skill-graph/src/index.ts \
            packages/core-tests/skill-graph.test.ts

      - name: Validate Platform state
        run: |
          npm run test
          npm run typecheck
          npm run lint
          npm run format:check
          npm run build
          npm run verify:official

      - name: Commit synchronized fourteen-game state
        run: |
          git config user.name "aprincar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            canonical-games.json \
            apps/app/public/registry.json \
            apps/app/public/extensions \
            apps/hub/public/registry.json \
            apps/hub/public/extensions \
            apps/app/src/components/GameCard.tsx \
            apps/app/src/game-families.ts \
            apps/app/src/worlds.ts \
            packages/extension-contracts/src/types.ts \
            packages/skill-graph/src/index.ts \
            packages/core-tests/skill-graph.test.ts
          if git diff --cached --quiet; then
            echo "Fourteen-game state already synchronized."
            exit 0
          fi
          git commit -m "build: sync fourteen certified official games"
          git push origin HEAD:chore/pin-certified-mobile-games
