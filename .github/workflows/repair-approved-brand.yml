name: Repair approved brand assets

on:
  push:
    branches:
      - feat/approved-ui-1to1
    paths:
      - .github/workflows/repair-approved-brand.yml

permissions:
  contents: write

jobs:
  rebuild-approved-brand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install asset-processing dependencies
        run: python -m pip install pillow numpy opencv-python-headless
      - name: Produce genuinely transparent approved assets
        run: python scripts/repair-approved-brand.py
      - name: Commit canonical files and QA evidence
        run: |
          git config user.name "aprincar-brand"
          git config user.email "actions@users.noreply.github.com"
          git add apps/app/public/brand/*-v4.* apps/hub/public/brand/*-v4.* docs/design/APPROVED_BRAND_ALPHA_QA.json
          if git diff --cached --quiet; then
            echo "Approved assets already synchronized."
          else
            git commit -m "fix(brand): publish alpha-verified approved identity assets"
            git push origin HEAD:feat/approved-ui-1to1
          fi
