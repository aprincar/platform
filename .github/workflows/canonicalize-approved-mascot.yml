name: Canonicalize approved mascot transparency

on:
  push:
    branches:
      - feat/approved-ui-1to1
    paths:
      - .github/workflows/canonicalize-approved-mascot.yml

permissions:
  contents: write

jobs:
  mascot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Remove connected background and preserve subject
        run: |
          python - <<'PY'
          from PIL import Image
          from collections import deque
          from pathlib import Path
          import colorsys

          path = Path('apps/app/public/brand/mascot-approved.webp')
          image = Image.open(path).convert('RGBA')
          width, height = image.size
          pixels = image.load()

          def candidate(x, y):
              r, g, b, _ = pixels[x, y]
              rf, gf, bf = r / 255.0, g / 255.0, b / 255.0
              mx, mn = max(rf, gf, bf), min(rf, gf, bf)
              sat = 0.0 if mx == 0 else (mx - mn) / mx
              lum = 0.2126 * rf + 0.7152 * gf + 0.0722 * bf
              # White and pale-blue illustration background. White clothing stays
              # because only candidate pixels connected to the outer border are removed.
              return (lum > 0.69 and sat < 0.62) or (r > 180 and g > 190 and b > 205)

          seen = bytearray(width * height)
          queue = deque()

          def push(x, y):
              idx = y * width + x
              if not seen[idx] and candidate(x, y):
                  seen[idx] = 1
                  queue.append((x, y))

          for x in range(width):
              push(x, 0)
              push(x, height - 1)
          for y in range(height):
              push(0, y)
              push(width - 1, y)

          while queue:
              x, y = queue.popleft()
              if x > 0: push(x - 1, y)
              if x + 1 < width: push(x + 1, y)
              if y > 0: push(x, y - 1)
              if y + 1 < height: push(x, y + 1)

          alpha = Image.new('L', image.size, 255)
          ap = alpha.load()
          transparent = 0
          for y in range(height):
              for x in range(width):
                  if seen[y * width + x]:
                      ap[x, y] = 0
                      transparent += 1

          # Feather one pixel around the extracted subject to avoid a white halo.
          original = alpha.copy()
          op = original.load()
          for y in range(1, height - 1):
              for x in range(1, width - 1):
                  if op[x, y] == 255 and candidate(x, y):
                      if min(op[x-1,y], op[x+1,y], op[x,y-1], op[x,y+1]) == 0:
                          ap[x, y] = 110

          ratio = transparent / (width * height)
          if ratio < 0.15:
              raise SystemExit(f'Background removal too small: {ratio:.3f}')
          if ap[0, 0] != 0 or ap[width - 1, height - 1] != 0:
              raise SystemExit('Mascot corners must be transparent')

          image.putalpha(alpha)
          image.save(path, 'WEBP', quality=92, method=6, exact=True)
          print(f'Generated transparent mascot: {width}x{height}; transparent={ratio:.1%}')
          PY

      - name: Commit canonical transparent mascot
        run: |
          git config user.name "aprincar-brand"
          git config user.email "actions@users.noreply.github.com"
          git add apps/app/public/brand/mascot-approved.webp
          if git diff --cached --quiet; then
            echo "Mascot already canonical."
            exit 0
          fi
          git commit -m "fix(brand): make approved mascot background transparent"
          git push origin HEAD:feat/approved-ui-1to1
