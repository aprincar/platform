name: Reconcile approved V5 and games
on:
  push:
    branches: [feat/production-v5-integration]
    paths: [.github/workflows/production-v5-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-v5-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge pinned design commits without changing main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for head in 98fab1890a9a256dccbcd8431ca8a1150473c850 2cbc19959cc25cde14803d219b29deffe4b5a92d; do
            if ! git merge --no-commit --no-ff "$head"; then
              git diff --name-only --diff-filter=U
              while IFS= read -r file; do
                case "$file" in
                  canonical-games.json|package-lock.json|apps/app/public/registry.json|apps/hub/public/registry.json|apps/app/public/extensions/*|apps/hub/public/extensions/*|games/official/games/*|games/official/dist/*)
                    git checkout --ours -- "$file"
                    git add "$file"
                    ;;
                  games/official/tests/browser-harness.mjs)
                    # Both branches fix the same cleanup race; retain the validated graceful CDP shutdown from main.
                    git checkout --ours -- "$file"
                    git add "$file"
                    ;;
                  games/official/tests/runtime-quality.test.mjs)
                    # Keep the approved artwork and brand assertions from the games redesign,
                    # while using the cleanup contract matching the retained harness.
                    git checkout --theirs -- "$file"
                    node --input-type=module - "$file" <<'NODE'
          import fs from 'node:fs';
          const file = process.argv[2];
          let source = fs.readFileSync(file, 'utf8');
          const original = source;
          source = source.replace(/  assert\.match\(browserHarness, \/removeDirectoryWithRetry\/\);\n  assert\.match\(browserHarness, \/await sleep\\\(150\\\)\/\);/g, [
            '  assert.match(browserHarness, /Browser\\.close/);',
            '  assert.match(browserHarness, /processRef\\.signalCode/);',
            '  assert.match(browserHarness, /await fs\\.promises\\.rm\\(userDataDir/);',
            '  const retries = Number(browserHarness.match(/maxRetries:\\s*(\\d+)/)?.[1]);',
            '  const delay = Number(browserHarness.match(/retryDelay:\\s*(\\d+)/)?.[1]);',
            "  assert.ok(retries >= 8 && delay >= 75, 'profile cleanup must retain bounded filesystem retries');"
          ].join('\n'));
          if (source === original || source.includes('removeDirectoryWithRetry')) throw Error('Unexpected cleanup assertions');
          fs.writeFileSync(file, source);
          NODE
                    git add "$file"
                    ;;
                  *) echo "Manual reconciliation required: $file"; exit 1 ;;
                esac
              done < <(git diff --name-only --diff-filter=U)
            fi
            test -z "$(git diff --name-only --diff-filter=U)"
            git restore --source=HEAD --staged --worktree canonical-games.json package-lock.json
            git commit -m "Merge approved design candidate $head"
          done
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --no-audit
          npm run build:games
          git rm .github/workflows/production-v5-integration.yml
          git add -A
          git commit -m 'Regenerate canonical local snapshots for combined V5 candidate'
          git push origin HEAD:refs/heads/feat/production-v5-integration
      - name: Validate combined candidate
        run: |
          npm run check
          npm run format:check
          npm run check:snapshot
          npm run check:content
          npm run verify:official
          npm audit --audit-level=high
      - name: Browser acceptance
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --max-failures=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-integration-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
