name: Validate V5 production candidate
on:
  push:
    branches: [feat/production-v5-integration]
    paths: [.github/workflows/validate-v5-candidate.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-v5-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit
      - name: Format changed application and test files
        run: |
          npx prettier --write apps/app/src/components/ParentGate.tsx apps/app/src/components/GameCard.tsx apps/app/src/layout.tsx apps/app/src/pages/{Parent,More,Settings,Onboarding,Discover,Home}.tsx apps/app/package.json packages/learning-engine/src/index.ts packages/core-tests/learning-engine.test.ts e2e/{helpers.ts,profiles.spec.ts,visual-screenshots.spec.ts,final-consistency-matrix.spec.ts,parent-mode.spec.ts,onboarding.spec.ts,community-filtering.spec.ts,gameplay.spec.ts,library-offline.spec.ts}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/validate-v5-candidate.yml
          git add -A
          git commit -m 'style: format first production V5 candidate'
          git push origin HEAD:refs/heads/feat/production-v5-integration
      - name: Validate source and games
        run: |
          npm run check
          npm run format:check
          npm run check:snapshot
          npm run check:content
          npm run verify:official
          npm audit --audit-level=high
      - name: Browser acceptance
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --max-failures=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-production-validation
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
