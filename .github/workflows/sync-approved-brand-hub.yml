name: Sync approved brand to Hub

on:
  push:
    branches:
      - feat/approved-ui-1to1
    paths:
      - .github/workflows/sync-approved-brand-hub.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy canonical brand assets
        run: |
          mkdir -p apps/hub/public/brand
          cp apps/app/public/brand/mascot-approved.webp apps/hub/public/brand/
          cp apps/app/public/brand/mascot-approved.png apps/hub/public/brand/
          cp apps/app/public/brand/logo-horizontal-approved.png apps/hub/public/brand/
          cp apps/app/public/brand/logo-wordmark-approved.png apps/hub/public/brand/
          cp apps/app/public/brand/logo-symbol-approved.png apps/hub/public/brand/
          cp apps/app/public/brand/logo-horizontal-approved-dark.png apps/hub/public/brand/
          cp apps/app/public/brand/app-icon-approved.png apps/hub/public/brand/
      - name: Commit Hub brand assets
        run: |
          git config user.name "aprincar-brand"
          git config user.email "actions@users.noreply.github.com"
          git add apps/hub/public/brand
          if git diff --cached --quiet; then
            echo "Hub assets already synchronized."
            exit 0
          fi
          git commit -m "fix(brand): sync canonical assets to Hub"
          git push origin HEAD:feat/approved-ui-1to1
