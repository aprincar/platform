name: Build Web Artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with: { name: aprincar-app, path: apps/app/dist }
      - uses: actions/upload-artifact@v4
        with: { name: aprincar-hub, path: apps/hub/dist }
