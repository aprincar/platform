name: Preserve legacy Git refs
on:
  push:
    branches: [chore/preserve-legacy-refs]
    paths: [.github/workflows/preserve-legacy-refs.yml]
permissions:
  contents: write
jobs:
  preserve:
    if: github.repository == 'aprincar/platform'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/preserve-legacy-refs
          fetch-depth: 0
      - name: Preserve every legacy tip as Git ancestry without publishing old workflow trees
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/legacy-git-refs
          manifest=docs/legacy-git-refs/refs.tsv
          printf 'repository\tref\tobject_sha\tcommit_sha\n' > "$manifest"
          for repo in games-official community-games curriculum-bncc game-template-vite game-template-react game-template-phaser game-template-threejs; do
            git fetch --no-tags "https://github.com/aprincar/$repo.git" "+refs/heads/*:refs/legacy/$repo/heads/*" "+refs/tags/*:refs/legacy/$repo/tags/*"
            while read -r ref; do
              test -n "$ref" || continue
              object="$(git rev-parse "$ref")"
              commit="$(git rev-parse "$ref^{commit}")"
              printf '%s\t%s\t%s\t%s\n' "$repo" "${ref#refs/legacy/$repo/}" "$object" "$commit" >> "$manifest"
              if [[ "$(git cat-file -t "$object")" == tag ]]; then
                git cat-file tag "$object" > "docs/legacy-git-refs/$object.tag"
              fi
              if ! git merge-base --is-ancestor "$commit" HEAD; then
                next="$(git commit-tree HEAD^{tree} -p HEAD -p "$commit" -m "chore: preserve legacy $repo ${ref#refs/legacy/$repo/}")"
                git update-ref HEAD "$next"
              fi
              git merge-base --is-ancestor "$commit" HEAD
              echo "Verified $repo $ref $commit"
            done < <(git for-each-ref --format='%(refname)' "refs/legacy/$repo/")
          done
          git add docs/legacy-git-refs/
          git commit -m "docs: record archived branch and tag provenance"
          git push origin HEAD:refs/heads/chore/preserve-legacy-refs
          echo 'Git tips preserved; release assets, issues and metadata still require separate backup.'
