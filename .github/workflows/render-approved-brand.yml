name: Render canonical approved brand PNGs
on:
  push:
    branches: [feat/approved-ui-1to1]
    paths: [.github/workflows/render-approved-brand.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vector renderer
        run: python -m pip install "CairoSVG>=2.7,<3" "Pillow>=10,<12"
      - name: Render raster fallbacks from canonical approved SVGs
        run: python scripts/brand/build-approved-raster.py
      - name: Commit corrected assets
        run: |
          git config user.name "aprincar-brand"
          git config user.email "actions@users.noreply.github.com"
          git add apps/app/public/brand apps/hub/public/brand
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(brand): replace incorrect raster logos with vector-derived assets"
          git push origin HEAD:feat/approved-ui-1to1
