name: Publish App and Hub to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-platform-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build-site:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4

      - name: Checkout approved UI preview branch
        uses: actions/checkout@v4
        with:
          ref: 98fab1890a9a256dccbcd8431ca8a1150473c850
          path: .approved-ui-preview

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies
        run: npm ci

      - name: Install preview dependencies
        working-directory: .approved-ui-preview
        run: npm ci

      - name: Verify production snapshot
        run: |
          npm run check:snapshot
          npm run verify:official

      - name: Verify preview snapshot
        working-directory: .approved-ui-preview
        run: npm run verify:official

      - name: Assemble static production site with approved UI preview
        run: |
          rm -rf site
          mkdir -p site/app site/hub site/extensions site/preview/approved-ui site/preview/extensions

          # Production stays unchanged at /platform/.
          VITE_BASE_PATH=/platform/app/ npm run build -w @aprincar/app
          VITE_BASE_PATH=/platform/hub/ VITE_APRINCAR_APP_URL=/platform/app npm run build -w @aprincar/hub
          cp -R apps/app/dist/. site/app/
          cp -R apps/hub/dist/. site/hub/
          cp -R apps/app/public/extensions/. site/extensions/

          # Approved redesign is published independently at /platform/preview/approved-ui/.
          (
            cd .approved-ui-preview
            VITE_BASE_PATH=/platform/preview/approved-ui/ npm run build -w @aprincar/app
          )
          cp -R .approved-ui-preview/apps/app/dist/. site/preview/approved-ui/
          cp -R .approved-ui-preview/apps/app/public/extensions/. site/preview/extensions/

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function rewrite(file, prefix) {
            const entries = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const entry of entries) {
              for (const key of ['manifestUrl', 'entryUrl']) {
                if (entry[key]?.startsWith('/extensions/')) entry[key] = `${prefix}${entry[key]}`;
              }
            }
            fs.writeFileSync(file, `${JSON.stringify(entries, null, 2)}\n`);
          }

          rewrite('site/app/registry.json', '/platform');
          rewrite('site/hub/registry.json', '/platform');
          rewrite('site/preview/approved-ui/registry.json', '/platform/preview');
          NODE

          cp site/app/registry.json site/registry.json
          cp canonical-games.json site/canonical-games.json

          cp .approved-ui-preview/canonical-games.json site/preview/canonical-games.json
          printf '%s\n' '${{ github.sha }}' > site/production-sha.txt
          printf '%s\n' "$(git -C .approved-ui-preview rev-parse HEAD)" > site/preview/approved-ui/preview-sha.txt

          cat > site/index.html <<'HTML'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=app/"><title>Aprincar</title></head><body><p>Abrindo o <a href="app/">Aprincar</a>…</p><script>location.replace('app/' + location.search + location.hash)</script></body></html>
          HTML

          touch site/.nojekyll

      - name: Verify assembled site before upload
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          for (const prefix of ['app', 'hub', 'preview/approved-ui']) {
            const entries = JSON.parse(fs.readFileSync('site/' + prefix + '/registry.json', 'utf8'));
            if (entries.length !== 14) throw Error(prefix + ': expected 14 games');
            for (const entry of entries) {
              for (const url of [entry.entryUrl, entry.manifestUrl]) {
                if (!url.startsWith('/platform/')) throw Error('Unexpected game URL: ' + url);
                if (!fs.existsSync('site/' + url.slice('/platform/'.length))) throw Error('Missing: ' + url);
              }
              const actual = crypto.createHash('sha256').update(fs.readFileSync('site/' + entry.entryUrl.slice('/platform/'.length))).digest('hex');
              if (actual !== entry.integrity) throw Error('Hash mismatch: ' + entry.id);
            }
          }
          NODE

      - name: Select artifact name
        id: artifact
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production + approved UI preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build-site.outputs.artifact_name }}

      - name: Verify published SHA and game catalog
        env:
          SITE: https://aprincar.github.io/platform
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            published="$(curl -fsSL "$SITE/production-sha.txt?sha=$EXPECTED_SHA" || true)"
            if [[ "$published" == "$EXPECTED_SHA" ]]; then break; fi
            sleep 5
          done
          test "$published" = "$EXPECTED_SHA"
          curl -fsSL "$SITE/app/" >/dev/null
          curl -fsSL "$SITE/hub/" >/dev/null
          curl -fsSL "$SITE/preview/approved-ui/" >/dev/null
          curl -fsSL "$SITE/registry.json?sha=$EXPECTED_SHA" | jq -e 'type == "array" and length == 14'
