name: Publish App and Hub to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-platform
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read canonical games pin
        id: games-pin
        run: |
          node -e "const fs=require('fs'); process.stdout.write('ref=' + JSON.parse(fs.readFileSync('canonical-games.json','utf8')).commit + '\\n')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: aprincar/games-official
          ref: ${{ steps.games-pin.outputs.ref }}
          path: .canonical-games
      - name: Build canonical games
        working-directory: .canonical-games
        run: npm run check
      - name: Regenerate official snapshot
        env:
          APRINCAR_CANONICAL_GAMES_DIR: .canonical-games/dist
        run: node scripts/sync-official-snapshot.mjs
      - name: Require committed snapshot to match pin
        run: git diff --exit-code -- apps/app/public/registry.json apps/app/public/extensions apps/hub/public/registry.json apps/hub/public/extensions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify canonical snapshot integrity
        env:
          APRINCAR_CANONICAL_GAMES_DIR: .canonical-games/dist
        run: npm run verify:official
      - name: Remove auxiliary canonical-games checkout before Platform lint
        run: rm -rf .canonical-games
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read canonical games pin
        id: games-pin
        run: |
          node -e "const fs=require('fs'); process.stdout.write('ref=' + JSON.parse(fs.readFileSync('canonical-games.json','utf8')).commit + '\\n')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: aprincar/games-official
          ref: ${{ steps.games-pin.outputs.ref }}
          path: .canonical-games
      - name: Build canonical games
        working-directory: .canonical-games
        run: npm run check
      - name: Generate deploy snapshot from pinned source
        env:
          APRINCAR_CANONICAL_GAMES_DIR: .canonical-games/dist
        run: node scripts/sync-official-snapshot.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assemble static production site
        run: |
          rm -rf site
          mkdir -p site/app site/hub site/extensions
          VITE_BASE_PATH=/platform/app/ npm run build -w @aprincar/app
          VITE_BASE_PATH=/platform/hub/ VITE_APRINCAR_APP_URL=/platform/app npm run build -w @aprincar/hub
          cp -R apps/app/dist/. site/app/
          cp -R apps/hub/dist/. site/hub/
          cp -R apps/app/public/extensions/. site/extensions/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['site/app/registry.json', 'site/hub/registry.json']) {
            const entries = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const entry of entries) {
              for (const key of ['manifestUrl', 'entryUrl']) {
                if (entry[key]?.startsWith('/extensions/')) entry[key] = `/platform${entry[key]}`;
              }
            }
            fs.writeFileSync(file, `${JSON.stringify(entries, null, 2)}\n`);
          }
          NODE
          cp site/app/registry.json site/registry.json
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=app/"><title>Aprincar</title></head><body><p>Abrindo o <a href="app/">Aprincar</a>…</p><script>location.replace('app/' + location.search + location.hash)</script></body></html>
          HTML
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
