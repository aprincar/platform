name: Publish App and Hub to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-platform-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  preview-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify committed official snapshot
        run: npm run verify:official
      - name: Build App and Hub
        run: npm run build

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4

      - name: Checkout approved UI preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/approved-ui-1to1
          path: .approved-ui-preview

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies
        run: npm ci

      - name: Install preview dependencies
        working-directory: .approved-ui-preview
        run: npm ci

      - name: Verify production snapshot
        run: npm run verify:official

      - name: Verify preview snapshot
        working-directory: .approved-ui-preview
        run: npm run verify:official

      - name: Assemble static production site with approved UI preview
        run: |
          rm -rf site
          mkdir -p site/app site/hub site/extensions site/preview/approved-ui site/preview/extensions

          # Production stays unchanged at /platform/.
          VITE_BASE_PATH=/platform/app/ npm run build -w @aprincar/app
          VITE_BASE_PATH=/platform/hub/ VITE_APRINCAR_APP_URL=/platform/app npm run build -w @aprincar/hub
          cp -R apps/app/dist/. site/app/
          cp -R apps/hub/dist/. site/hub/
          cp -R apps/app/public/extensions/. site/extensions/

          # Approved redesign is published independently at /platform/preview/approved-ui/.
          (
            cd .approved-ui-preview
            VITE_BASE_PATH=/platform/preview/approved-ui/ npm run build -w @aprincar/app
          )
          cp -R .approved-ui-preview/apps/app/dist/. site/preview/approved-ui/
          cp -R .approved-ui-preview/apps/app/public/extensions/. site/preview/extensions/

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function rewrite(file, prefix) {
            const entries = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const entry of entries) {
              for (const key of ['manifestUrl', 'entryUrl']) {
                if (entry[key]?.startsWith('/extensions/')) entry[key] = `${prefix}${entry[key]}`;
              }
            }
            fs.writeFileSync(file, `${JSON.stringify(entries, null, 2)}\n`);
          }

          rewrite('site/app/registry.json', '/platform');
          rewrite('site/hub/registry.json', '/platform');
          rewrite('site/preview/approved-ui/registry.json', '/platform/preview');
          NODE

          cp site/app/registry.json site/registry.json
          cp canonical-games.json site/canonical-games.json
          cp .approved-ui-preview/canonical-games.json site/preview/canonical-games.json
          printf '%s\n' '${{ github.sha }}' > site/production-sha.txt
          printf '%s\n' "$(git -C .approved-ui-preview rev-parse HEAD)" > site/preview/approved-ui/preview-sha.txt

          cat > site/index.html <<'HTML'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=app/"><title>Aprincar</title></head><body><p>Abrindo o <a href="app/">Aprincar</a>…</p><script>location.replace('app/' + location.search + location.hash)</script></body></html>
          HTML

          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy production + approved UI preview
        id: deployment
        uses: actions/deploy-pages@v4
