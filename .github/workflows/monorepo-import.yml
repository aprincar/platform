name: One-time monorepo import
on:
  push:
    branches: [chore/monorepo-consolidation]
    paths: [.github/workflows/monorepo-import.yml]
permissions:
  contents: write
concurrency:
  group: aprincar-monorepo-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'aprincar/platform' && github.ref == 'refs/heads/chore/monorepo-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/monorepo-consolidation
          fetch-depth: 0
      - name: Import pinned public histories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/import-monorepo.sh --apply
          git rm .github/workflows/monorepo-import.yml
          git commit -m "chore: remove one-time import workflow"
          git push origin HEAD:refs/heads/chore/monorepo-consolidation
