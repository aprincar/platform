name: Sync Aprincar V4 Games Snapshot

on:
  push:
    branches:
      - chore/pin-certified-mobile-games
    paths:
      - canonical-games.json
      - .github/workflows/sync-aprincar-v4-snapshot.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pin-certified-mobile-games
          fetch-depth: 0

      - name: Read canonical games pin
        id: games-pin
        run: |
          node -e "const fs=require('fs'); process.stdout.write('ref=' + JSON.parse(fs.readFileSync('canonical-games.json','utf8')).commit + '\\n')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: aprincar/games-official
          ref: ${{ steps.games-pin.outputs.ref }}
          path: .canonical-games

      - name: Build canonical games snapshot
        working-directory: .canonical-games
        run: |
          npm run build
          npm run registry

      - name: Sync snapshot into App and Hub
        env:
          APRINCAR_CANONICAL_GAMES_DIR: .canonical-games/dist
        run: node scripts/sync-official-snapshot.mjs

      - name: Verify generated snapshot
        env:
          APRINCAR_CANONICAL_GAMES_DIR: .canonical-games/dist
        run: npm run verify:official

      - name: Commit regenerated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/public/registry.json apps/app/public/extensions apps/hub/public/registry.json apps/hub/public/extensions
          if git diff --cached --quiet; then
            echo "Snapshot already synchronized."
            exit 0
          fi
          git commit -m "chore: sync Aprincar v4 games snapshot"
          git push origin HEAD:chore/pin-certified-mobile-games
