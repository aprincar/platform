name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: node scripts/check-boundaries.mjs
      - run: npm run verify:official
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Semantic and responsive E2E
        run: npm run test:e2e

  canonical-games:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate imported workspaces
        run: npm run check:content
      - name: Require canonical game snapshot parity
        run: npm run check:snapshot
      - name: Verify canonical snapshot integrity
        run: npm run verify:official
