name: Fix dependency audit

on:
  push:
    branches:
      - feat/approved-ui-1to1
    paths:
      - .github/workflows/fix-audit-approved-ui.yml

permissions:
  contents: write

jobs:
  fix-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/approved-ui-1to1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fix
        run: npm audit fix
      - name: Verify high severity audit
        run: npm audit --audit-level=high
      - name: Verify tests and typecheck
        run: |
          npm run test
          npm run typecheck
      - name: Commit lockfile fix
        run: |
          if git diff --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "aprincar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): update vulnerable transitive dependency"
          git push origin HEAD:feat/approved-ui-1to1
