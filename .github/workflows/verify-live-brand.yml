name: Verify live approved UI assets
on:
  push:
    branches: [feat/approved-ui-1to1]
    paths: [.github/workflows/verify-live-brand.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify the actual public Pages files
        run: |
          python -m pip install "Pillow>=10,<12" "requests>=2.32,<3"
          python - <<'PY'
          import requests
          from PIL import Image
          from io import BytesIO
          ROOT='https://aprincar.github.io/platform/preview/approved-ui/'
          session=requests.Session()
          def get(path):
              res=session.get(ROOT+path,timeout=35,headers={'Cache-Control':'no-cache'})
              res.raise_for_status()
              print('GET',path,res.status_code,res.headers.get('content-type'),len(res.content))
              return res
          sha=get('preview-sha.txt').text.strip()
          print('Published preview SHA:',sha)
          if len(sha)!=40: raise RuntimeError('Not a full preview commit SHA')
          logo=get('brand/logo-horizontal.svg').text
          if 'symbolBlue' not in logo or '#FBBF24' not in logo or 'viewBox="0 0 745 195"' not in logo:
              raise RuntimeError('Wrong published logo')
          mascot=get('brand/mascot-approved.webp')
          image=Image.open(BytesIO(mascot.content)).convert('RGBA')
          alpha=image.getchannel('A')
          w,h=image.size
          print('Mascot alpha',image.size,'corners',[alpha.getpixel(xy) for xy in ((0,0),(w-1,0),(0,h-1),(w-1,h-1))])
          if alpha.getpixel((0,0))>20 or alpha.getpixel((w-1,0))>20:
              raise RuntimeError('Mascot background not removed')
          if alpha.getpixel((int(w*.5),int(h*.3)))<150:
              raise RuntimeError('Mascot face damaged')
          entries=get('registry.json').json()
          if len(entries)<14: raise RuntimeError('Missing official games')
          for entry in entries:
              for key in ('manifestUrl','entryUrl'):
                  if not entry[key].startswith('/platform/preview/approved-ui/extensions/'):
                      raise RuntimeError(f'Incorrect preview extension URL: {entry[key]}')
          html=get('index.html').text
          if '/platform/preview/approved-ui/' not in html:
              raise RuntimeError('Vite base path invalid')
          PY
