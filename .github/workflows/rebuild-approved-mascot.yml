name: Rebuild approved mascot transparency

on:
  push:
    branches:
      - feat/approved-ui-1to1
    paths:
      - .github/workflows/rebuild-approved-mascot.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install background-removal tooling
        run: python -m pip install --disable-pip-version-check "rembg[cpu]>=2.0.60,<3" pillow

      - name: Remove only the mascot background
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          from rembg import remove, new_session

          root = Path('apps/app/public/brand')
          source = root / 'mascot-approved.png'
          if not source.exists():
              source = root / 'mascot-approved.webp'

          session = new_session('u2netp')
          result = remove(
              source.read_bytes(),
              session=session,
              alpha_matting=True,
              alpha_matting_foreground_threshold=235,
              alpha_matting_background_threshold=15,
              alpha_matting_erode_size=8,
          )

          image = Image.open(BytesIO(result)).convert('RGBA')
          alpha = image.getchannel('A')
          lo, hi = alpha.getextrema()
          transparent = sum(1 for value in alpha.getdata() if value <= 8) / (image.width * image.height)

          if lo != 0 or hi != 255:
              raise SystemExit(f'alpha range invalid: {(lo, hi)}')
          if transparent < 0.18:
              raise SystemExit(f'background removal insufficient: transparent={transparent:.3f}')

          image.save(root / 'mascot-approved.png', optimize=True)
          image.save(root / 'mascot-approved.webp', 'WEBP', quality=90, method=6)

          # Guard against the old rectangular-background regression.
          for xy in [(0, 0), (image.width - 1, 0), (0, image.height - 1), (image.width - 1, image.height - 1)]:
              if alpha.getpixel(xy) > 8:
                  raise SystemExit(f'corner is not transparent: {xy}')

          print(f'mascot={image.size} transparent={transparent:.3f}')
          PY

      - name: Commit canonical transparent mascot
        run: |
          git config user.name "aprincar-brand"
          git config user.email "actions@users.noreply.github.com"
          git add apps/app/public/brand/mascot-approved.png apps/app/public/brand/mascot-approved.webp
          if git diff --cached --quiet; then
            echo "Mascot already transparent."
            exit 0
          fi
          git commit -m "fix(brand): make approved mascot background transparent"
          git push origin HEAD:feat/approved-ui-1to1
