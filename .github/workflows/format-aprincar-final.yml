name: Format Aprincar Final Files

on:
  push:
    branches:
      - chore/pin-certified-mobile-games
    paths:
      - .github/workflows/format-aprincar-final.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pin-certified-mobile-games
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format final changed files
        run: |
          npx prettier --write             apps/app/src/pages/Home.tsx             apps/app/src/styles.css             e2e/final-consistency-matrix.spec.ts             e2e/helpers.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/app/src/pages/Home.tsx             apps/app/src/styles.css             e2e/final-consistency-matrix.spec.ts             e2e/helpers.ts
          if git diff --cached --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git commit -m "style: format final Aprincar v4 changes"
          git push origin HEAD:chore/pin-certified-mobile-games
