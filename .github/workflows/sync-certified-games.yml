name: Sync certified games snapshot
# final design pass

on:
  push:
    branches:
      - chore/pin-certified-mobile-games
    paths:
      - .github/workflows/sync-certified-games.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout platform branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout certified games source
        uses: actions/checkout@v4
        with:
          repository: aprincar/games-official
          ref: 6e05593ee27968393b58490592b33a7965f2a421
          path: .canonical-games

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build certified games
        working-directory: .canonical-games
        run: |
          npm ci
          npm run build
          npm run registry

      - name: Update canonical pin
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const path = 'canonical-games.json';
          const pin = JSON.parse(fs.readFileSync(path, 'utf8'));
          pin.commit = '6e05593ee27968393b58490592b33a7965f2a421';
          fs.writeFileSync(path, JSON.stringify(pin, null, 2) + '\n');
          NODE

      - name: Regenerate App and Hub snapshots
        run: npm run sync:official

      - name: Verify canonical snapshot
        run: npm run verify:official

      - name: Install platform dependencies
        run: npm ci

      - name: Format design system changes
        run: |
          npx prettier --write \
            apps/app/src/app-store.tsx \
            apps/app/src/game-families.ts \
            apps/app/src/pages/Settings.tsx \
            apps/app/src/styles.css \
            apps/app/src/theme.ts \
            docs/design/BRAND_GUIDELINES.md \
            docs/design/DESIGN_SYSTEM.md \
            docs/design/INFORMATION_ARCHITECTURE.md \
            packages/core-tests/visual-contract.test.ts

      - name: Commit synchronized snapshot
        run: |
          git config user.name "aprincar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            canonical-games.json \
            apps/app/public/registry.json \
            apps/app/public/extensions \
            apps/hub/public/registry.json \
            apps/hub/public/extensions \
            apps/app/src/app-store.tsx \
            apps/app/src/game-families.ts \
            apps/app/src/pages/Settings.tsx \
            apps/app/src/styles.css \
            apps/app/src/theme.ts \
            docs/design/BRAND_GUIDELINES.md \
            docs/design/DESIGN_SYSTEM.md \
            docs/design/INFORMATION_ARCHITECTURE.md \
            packages/core-tests/visual-contract.test.ts
          if git diff --cached --quiet; then
            echo "Snapshot already synchronized."
            exit 0
          fi
          git commit -m "build(games): sync certified games snapshot"
          git push origin HEAD:chore/pin-certified-mobile-games
