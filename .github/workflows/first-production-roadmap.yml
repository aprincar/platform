name: Configure first production milestones
on:
  push:
    branches: [chore/first-production-roadmap]
    paths: [.github/workflows/first-production-roadmap.yml]
permissions:
  contents: read
  issues: write
jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create milestones and assign issues via REST
        shell: bash
        run: |
          set -euo pipefail
          repo=aprincar/platform
          entries=(
            'F1|Fundação técnica|57 58 59 70 71'
            'F2|Experiência infantil|60 72 73 79'
            'F3|Jogos e conteúdo pedagógico|61 62 74 75 76 77'
            'F4|Aprendizagem, responsáveis e privacidade|63 78 80 81 83'
            'F5|Homologação e lançamento|64 82 84 85'
          )
          for entry in "${entries[@]}"; do
            IFS='|' read -r phase title issues <<< "$entry"
            title="$phase — $title"
            echo "Checking milestone $title"
            existing="$(gh api "repos/$repo/milestones?state=all&per_page=100")"
            number="$(jq -r --arg t "$title" '.[] | select(.title==$t) | .number' <<< "$existing")"
            if [[ -z "$number" ]]; then
              response="$(gh api --method POST "repos/$repo/milestones" -f title="$title" -f description='Primeira produção — epic #56')"
              number="$(jq -er .number <<< "$response")"
            fi
            [[ "$number" =~ ^[0-9]+$ ]]
            for issue in $issues; do
              echo "Assigning issue $issue to $number"
              gh api --method PATCH "repos/$repo/issues/$issue" -F milestone="$number" --jq '{number,milestone:.milestone.title}'
            done
          done
          gh api "repos/$repo/milestones?state=all&per_page=100" --jq '.[] | {number,title,open_issues,closed_issues}'
