<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f7f6f2;color:#242523;display:grid;place-items:center;min-height:100vh}main{width:min(920px,94vw);background:white;border-radius:28px;padding:28px;box-shadow:0 20px 60px #0002}h1{color:#6F5BD7;margin-top:0}button{border:0;border-radius:18px;padding:15px 20px;font-size:18px;font-weight:800;cursor:pointer;background:#6F5BD7;color:white}.options{display:flex;flex-wrap:wrap;gap:12px}.option{min-width:76px;min-height:64px;font-size:28px}.status{min-height:28px;font-weight:700;margin:14px 0}.soft{background:#efeafe;padding:18px;border-radius:20px}canvas{touch-action:none;background:#fffdf8;border:3px dashed #d8d2ca;border-radius:20px;width:100%;height:420px}@media(max-width:600px){main{border-radius:0;min-height:100vh;padding:18px}}</style><main><h1>Torre de Blocos</h1><p>Conte e escolha a quantidade correta.</p><div class="soft" style="text-align:center"><div id="objects" style="font-size:54px;letter-spacing:8px"></div><p>Quantos há aqui?</p><div id="options" class="options" style="justify-content:center"></div></div><div class="status" id="status"></div></main>
<script>
(()=>{let port=null;const pending=new Map();let connectedResolve;const connected=new Promise(r=>connectedResolve=r);window.addEventListener('message',e=>{if(e.data?.type!=='APRINCAR_CONNECT'||e.data?.protocolVersion!==1||!e.ports?.[0])return;port=e.ports[0];port.onmessage=ev=>{const m=ev.data;if(m?.type==='host.response'&&m.requestId){const p=pending.get(m.requestId);if(!p)return;pending.delete(m.requestId);m.ok?p.resolve(m.payload):p.reject(new Error(m.error||'Host error'))}};port.start();connectedResolve();port.postMessage({type:'game.ready',payload:{protocolVersion:1}})});window.aprincar={async request(type,payload={}){await connected;const requestId=crypto.randomUUID();return new Promise((resolve,reject)=>{pending.set(requestId,{resolve,reject});port.postMessage({type,requestId,payload})})},session:{start:p=>window.aprincar.request('session.start',p),complete:p=>window.aprincar.request('session.complete',p)},evidence:{submit:p=>window.aprincar.request('evidence.submit',p)},rewards:{request:p=>window.aprincar.request('reward.request',p)},storage:{get:key=>window.aprincar.request('storage.get',{key}),set:(key,value)=>window.aprincar.request('storage.set',{key,value})},capability:{request:(name,payload)=>window.aprincar.request('capability.request',{name,payload})}}})();
</script>
<script>let target=1;let session;async function round(){target=2+Math.floor(Math.random()*8);document.querySelector('#objects').textContent='🧱'.repeat(target);const opts=[target,...new Set([Math.max(1,target-1),Math.min(10,target+1),1+Math.floor(Math.random()*10)])].filter(x=>x!==target).slice(0,4).sort(()=>Math.random()-.5);document.querySelector('#options').innerHTML=opts.map(n=>`<button class="option" data-n="${n}">${n}</button>`).join('');document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.n)))}async function answer(n){const ok=n===target;document.querySelector('#status').textContent=ok?'Você encontrou! ✨':'Quase! Conte de novo.';await aprincar.evidence.submit({skillId:'math.counting.1-10',result:ok?'success':'failure',independent:true,assistance:'none',difficulty:.5,confidence:.9});if(ok){await aprincar.rewards.request({reason:'counting-round',amount:2});setTimeout(round,650)}};(async()=>{session=await aprincar.session.start();round()})();</script></html>
