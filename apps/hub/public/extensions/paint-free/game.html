<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f7f6f2;color:#242523;display:grid;place-items:center;min-height:100vh}main{width:min(920px,94vw);background:white;border-radius:28px;padding:28px;box-shadow:0 20px 60px #0002}h1{color:#6F5BD7;margin-top:0}button{border:0;border-radius:18px;padding:15px 20px;font-size:18px;font-weight:800;cursor:pointer;background:#6F5BD7;color:white}.options{display:flex;flex-wrap:wrap;gap:12px}.option{min-width:76px;min-height:64px;font-size:28px}.status{min-height:28px;font-weight:700;margin:14px 0}.soft{background:#efeafe;padding:18px;border-radius:20px}canvas{touch-action:none;background:#fffdf8;border:3px dashed #d8d2ca;border-radius:20px;width:100%;height:420px}@media(max-width:600px){main{border-radius:0;min-height:100vh;padding:18px}}</style><main><h1>Pintura Livre</h1><p>Desenhe livremente. Aqui não existe resposta certa.</p><canvas id="paint" width="800" height="420"></canvas><div class="options" style="margin-top:12px"><button id="clear">Limpar</button><button id="finish">Terminei</button></div><div class="status" id="status"></div></main>
<script>
(()=>{let port=null;const pending=new Map();let connectedResolve;const connected=new Promise(r=>connectedResolve=r);window.addEventListener('message',e=>{if(e.data?.type!=='APRINCAR_CONNECT'||e.data?.protocolVersion!==1||!e.ports?.[0])return;port=e.ports[0];port.onmessage=ev=>{const m=ev.data;if(m?.type==='host.response'&&m.requestId){const p=pending.get(m.requestId);if(!p)return;pending.delete(m.requestId);m.ok?p.resolve(m.payload):p.reject(new Error(m.error||'Host error'))}};port.start();connectedResolve();port.postMessage({type:'game.ready',payload:{protocolVersion:1}})});window.aprincar={async request(type,payload={}){await connected;const requestId=crypto.randomUUID();return new Promise((resolve,reject)=>{pending.set(requestId,{resolve,reject});port.postMessage({type,requestId,payload})})},session:{start:p=>window.aprincar.request('session.start',p),complete:p=>window.aprincar.request('session.complete',p)},evidence:{submit:p=>window.aprincar.request('evidence.submit',p)},rewards:{request:p=>window.aprincar.request('reward.request',p)},storage:{get:key=>window.aprincar.request('storage.get',{key}),set:(key,value)=>window.aprincar.request('storage.set',{key,value})},capability:{request:(name,payload)=>window.aprincar.request('capability.request',{name,payload})}}})();
</script>
<script>const c=paint,ctx=c.getContext('2d');ctx.lineWidth=9;ctx.lineCap='round';ctx.strokeStyle='#6F5BD7';let drawing=false,observed=false;function pos(e){const r=c.getBoundingClientRect(),p=e.touches?.[0]??e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}}function start(e){drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)}function move(e){if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();if(!observed){observed=true;aprincar.evidence.submit({skillId:'creativity.visual-expression',result:'observed',independent:true,assistance:'none',difficulty:.2,confidence:.7})}}c.onpointerdown=start;c.onpointermove=move;c.onpointerup=()=>drawing=false;c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=()=>drawing=false;clear.onclick=()=>ctx.clearRect(0,0,c.width,c.height);finish.onclick=async()=>{await aprincar.rewards.request({reason:'creative-session',amount:5});status.textContent='Sua criação foi registrada neste dispositivo. 🎨'};(async()=>{await aprincar.session.start()})();</script></html>
