<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f7f6f2;color:#242523;display:grid;place-items:center;min-height:100vh}main{width:min(920px,94vw);background:white;border-radius:28px;padding:28px;box-shadow:0 20px 60px #0002}h1{color:#62A6D8;margin-top:0}button{border:0;border-radius:18px;padding:15px 20px;font-size:18px;font-weight:800;cursor:pointer;background:#62A6D8;color:white}.options{display:flex;flex-wrap:wrap;gap:12px}.option{min-width:76px;min-height:64px;font-size:28px}.status{min-height:28px;font-weight:700;margin:14px 0}.soft{background:#efeafe;padding:18px;border-radius:20px}canvas{touch-action:none;background:#fffdf8;border:3px dashed #d8d2ca;border-radius:20px;width:100%;height:420px}@media(max-width:600px){main{border-radius:0;min-height:100vh;padding:18px}}</style><main><h1>Desenhe a Letra A</h1><p>Desenhe a letra <strong>A</strong> no quadro. O Aprincar avalia o gesto no Core, não dentro do jogo.</p><canvas id="pad" width="800" height="420"></canvas><div class="options" style="margin-top:12px"><button id="check">Conferir</button><button id="clear">Limpar</button></div><div class="status" id="status"></div></main>
<script>
(()=>{let port=null;const pending=new Map();let connectedResolve;const connected=new Promise(r=>connectedResolve=r);window.addEventListener('message',e=>{if(e.data?.type!=='APRINCAR_CONNECT'||e.data?.protocolVersion!==1||!e.ports?.[0])return;port=e.ports[0];port.onmessage=ev=>{const m=ev.data;if(m?.type==='host.response'&&m.requestId){const p=pending.get(m.requestId);if(!p)return;pending.delete(m.requestId);m.ok?p.resolve(m.payload):p.reject(new Error(m.error||'Host error'))}};port.start();connectedResolve();port.postMessage({type:'game.ready',payload:{protocolVersion:1}})});window.aprincar={async request(type,payload={}){await connected;const requestId=crypto.randomUUID();return new Promise((resolve,reject)=>{pending.set(requestId,{resolve,reject});port.postMessage({type,requestId,payload})})},session:{start:p=>window.aprincar.request('session.start',p),complete:p=>window.aprincar.request('session.complete',p)},evidence:{submit:p=>window.aprincar.request('evidence.submit',p)},rewards:{request:p=>window.aprincar.request('reward.request',p)},storage:{get:key=>window.aprincar.request('storage.get',{key}),set:(key,value)=>window.aprincar.request('storage.set',{key,value})},capability:{request:(name,payload)=>window.aprincar.request('capability.request',{name,payload})}}})();
</script>
<script>const c=pad,ctx=c.getContext('2d');ctx.lineWidth=10;ctx.lineCap='round';ctx.strokeStyle='#6F5BD7';let strokes=[],stroke=null;function p(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,t:Date.now()}}c.onpointerdown=e=>{stroke=[];strokes.push(stroke);const q=p(e);stroke.push(q);ctx.beginPath();ctx.moveTo(q.x*c.width,q.y*c.height)};c.onpointermove=e=>{if(!stroke)return;const q=p(e);stroke.push(q);ctx.lineTo(q.x*c.width,q.y*c.height);ctx.stroke()};c.onpointerup=()=>stroke=null;clear.onclick=()=>{strokes=[];ctx.clearRect(0,0,c.width,c.height)};check.onclick=async()=>{const r=await aprincar.capability.request('handwriting.evaluate',{symbol:'A',strokes});status.textContent=r.recognized?'Boa construção! ✍️':'Vamos tentar com traços maiores.';await aprincar.evidence.submit({skillId:'writing.trace-letter',result:r.recognized?'success':'failure',independent:true,assistance:'none',difficulty:.5,confidence:r.confidence,metadata:{shape:r.shape,coverage:r.coverage,structure:r.structure}})};(async()=>{await aprincar.session.start()})();</script></html>
