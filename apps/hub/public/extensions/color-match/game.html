<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f7f6f2;color:#242523;display:grid;place-items:center;min-height:100vh}main{width:min(920px,94vw);background:white;border-radius:28px;padding:28px;box-shadow:0 20px 60px #0002}h1{color:#F07867;margin-top:0}button{border:0;border-radius:18px;padding:15px 20px;font-size:18px;font-weight:800;cursor:pointer;background:#F07867;color:white}.options{display:flex;flex-wrap:wrap;gap:12px}.option{min-width:76px;min-height:64px;font-size:28px}.status{min-height:28px;font-weight:700;margin:14px 0}.soft{background:#efeafe;padding:18px;border-radius:20px}canvas{touch-action:none;background:#fffdf8;border:3px dashed #d8d2ca;border-radius:20px;width:100%;height:420px}@media(max-width:600px){main{border-radius:0;min-height:100vh;padding:18px}}</style><main><h1>Combine as Cores</h1><p>Escolha a mesma cor do cartão.</p><div class="soft" style="text-align:center"><div id="sample" style="width:150px;height:150px;border-radius:30px;margin:auto"></div><div id="options" class="options" style="justify-content:center;margin-top:20px"></div></div><div class="status" id="status"></div></main>
<script>
(()=>{let port=null;const pending=new Map();let connectedResolve;const connected=new Promise(r=>connectedResolve=r);window.addEventListener('message',e=>{if(e.data?.type!=='APRINCAR_CONNECT'||e.data?.protocolVersion!==1||!e.ports?.[0])return;port=e.ports[0];port.onmessage=ev=>{const m=ev.data;if(m?.type==='host.response'&&m.requestId){const p=pending.get(m.requestId);if(!p)return;pending.delete(m.requestId);m.ok?p.resolve(m.payload):p.reject(new Error(m.error||'Host error'))}};port.start();connectedResolve();port.postMessage({type:'game.ready',payload:{protocolVersion:1}})});window.aprincar={async request(type,payload={}){await connected;const requestId=crypto.randomUUID();return new Promise((resolve,reject)=>{pending.set(requestId,{resolve,reject});port.postMessage({type,requestId,payload})})},session:{start:p=>window.aprincar.request('session.start',p),complete:p=>window.aprincar.request('session.complete',p)},evidence:{submit:p=>window.aprincar.request('evidence.submit',p)},rewards:{request:p=>window.aprincar.request('reward.request',p)},storage:{get:key=>window.aprincar.request('storage.get',{key}),set:(key,value)=>window.aprincar.request('storage.set',{key,value})},capability:{request:(name,payload)=>window.aprincar.request('capability.request',{name,payload})}}})();
</script>
<script>const colors=[['Vermelho','#F07867'],['Amarelo','#F4C95D'],['Verde','#65A67A'],['Azul','#62A6D8'],['Roxo','#6F5BD7']];async function round(){const target=colors[Math.floor(Math.random()*colors.length)];sample.style.background=target[1];options.innerHTML=colors.sort(()=>Math.random()-.5).map(c=>`<button data-c="${c[1]}" style="background:${c[1]};width:70px;height:70px" aria-label="${c[0]}"></button>`).join('');options.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const ok=b.dataset.c===target[1];status.textContent=ok?'Combinou! 🎨':'Observe mais uma vez.';await aprincar.evidence.submit({skillId:'perception.colors.match',result:ok?'success':'failure',independent:true,assistance:'none',difficulty:.35,confidence:.9});if(ok)setTimeout(round,500)})};(async()=>{await aprincar.session.start();round()})();</script></html>
